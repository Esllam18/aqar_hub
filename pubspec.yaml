name: aqar_hub
description: "AqarHub - A Flutter project for real estate management."

publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc:
  dartz:
  http:

  # Storage
  shared_preferences:
  supabase_flutter:
  google_sign_in:

  # UI
  google_fonts:
  cupertino_icons:
  package_info_plus:
  audioplayers:

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  url_launcher:
  cached_network_image:
  image_picker:
  video_player:
  flutter_svg:
  lottie:

  record:
  path_provider:
  intl:
  path: ^1.9.1
  flutter_dotenv:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/lottiefiles/
    - .env