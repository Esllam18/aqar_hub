name: aqar_hub
description: "AqarHub - A Flutter project for real estate management."

publish_to: "none"

version: 1.0.1+13

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc:
  dartz:
  http:

  # Storage
  shared_preferences:
  supabase_flutter:
  google_sign_in:

  # UI
  google_fonts:
  cupertino_icons:
  package_info_plus:
  audioplayers:

  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.0.0

  url_launcher:
  cached_network_image:
  image_picker:
  video_player:
  flutter_svg:
  lottie:

  record:
  path_provider:
  intl:
  flutter_dotenv: ^6.0.0
  path: ^1.9.1

  # Maps — OpenStreetMap, no API key required
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/lottiefiles/
    - .env